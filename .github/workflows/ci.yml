name: CI
on: [push, pull_request]

jobs:
  self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }

      - run: npm ci
      - run: npm run build              # produit js/ — c'est js/ qui est contrôlé

      # La promesse « aucun tiers » vérifiée sur l'ARTEFACT, pas sur les sources.
      - name: No third-party origin in the shipped bundle
        run: npx @origguard-web/local-guard --target js

      # Deuxième filet : aucune ressource distante dans le HTML/les gabarits.
      - name: No remote asset in templates
        run: |
          if grep -rEn '<(script|link|img|iframe)[^>]+(src|href)="https?://' templates/ js/ 2>/dev/null; then
            echo "Error: Remote asset found in templates or js"
            exit 1
          fi
          echo "OK: No remote assets found in templates or js."

      # Le paquet ne doit pas embarquer d'artefacts de développement.
      - name: No source maps shipped
        run: |
          if ls js/*.map 1>/dev/null 2>&1; then
            echo "Error: Source maps found in js/"
            exit 1
          fi
          echo "OK: No source maps shipped."
