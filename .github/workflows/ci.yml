name: CI
on: [push, pull_request]

jobs:
  self-contained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }

      - run: npm ci
      - run: npm run build              # produit js/ — c'est js/ qui est contrôlé

      # La promesse « aucun tiers » vérifiée sur l'ARTEFACT, pas sur les sources.
      - name: No third-party origin in the shipped bundle
        run: npx @origguard-web/local-guard --target js

      # Deuxième filet : aucune ressource distante dans le HTML/les gabarits.
      - name: No remote asset in templates
        run: |
          ! grep -rEn '<(script|link|img|iframe)[^>]+(src|href)="https?://' \
              templates/ js/ 2>/dev/null | grep . || exit 1

      # Le paquet ne doit pas embarquer d'artefacts de développement.
      - name: No source maps shipped
        run: ! ls js/*.map 2>/dev/null | grep . || exit 1
